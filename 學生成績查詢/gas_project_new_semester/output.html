\\n        let distributionChartInstance \x3d null;\\n        let trendChartInstance \x3d null;\\n        let globalChartData \x3d null; \/\/ 🆕 儲存全域資料以供切換\\n\\n        function renderCharts(chartData) \x7b\\n        globalChartData \x3d chartData; \/\/ 存入全域\\n        const chartSection \x3d document.getElementById(\x27chart-section\x27);\\n\\n        if (!chartData || (!chartData.distributions \x26\x26 !chartData.trend)) \x7b\\n        chartSection.style.display \x3d \x27none\x27;\\n        return;\\n        \x7d\\n\\n        chartSection.style.display \x3d \x27block\x27;\\n\\n        \/\/ \x3d\x3d\x3d 1. 初始化下拉選單並渲染分佈圖 \x3d\x3d\x3d\\n        const selector \x3d document.getElementById(\x27examSelector\x27);\\n        selector.innerHTML \x3d \x27\x27;\\n\\n        if (chartData.distributions \x26\x26 chartData.distributions.length \x3e 0) \x7b\\n        \/\/ 填充選項\\n        chartData.distributions.forEach((dist, index) \x3d\x3e \x7b\\n        const opt \x3d document.createElement(\x27option\x27);\\n        opt.value \x3d index;\\n        opt.innerText \x3d dist.examName;\\n        selector.appendChild(opt);\\n        \x7d);\\n\\n        \/\/ 顯示下拉選單\\n        selector.style.display \x3d \x27block\x27;\\n\\n        \/\/ 預設選取最後一個（最新考試）\\n        selector.value \x3d chartData.distributions.length - 1;\\n\\n        \/\/ 渲染分佈圖\\n        updateDistributionChart();\\n        \x7d else \x7b\\n        \/\/ 無分佈資料\\n        selector.style.display \x3d \x27none\x27;\\n        \/\/ 清空畫布或顯示無資料\\n        if (distributionChartInstance) distributionChartInstance.destroy();\\n        \x7d\\n\\n        \/\/ \x3d\x3d\x3d 2. 渲染個人成績趨勢圖 \x3d\x3d\x3d\\n        renderTrendChart(chartData.trend);\\n        \x7d\\n\\n        \/\/ 🆕 更新分佈圖 (On Change)\\n        function updateDistributionChart() \x7b\\n        if (!globalChartData || !globalChartData.distributions) return;\\n\\n        const selector \x3d document.getElementById(\x27examSelector\x27);\\n        const index \x3d parseInt(selector.value);\\n        const distData \x3d globalChartData.distributions\x5bindex\x5d;\\n\\n        if (!distData) return;\\n\\n        const distCtx \x3d document.getElementById(\x27distributionChart\x27).getContext(\x272d\x27);\\n\\n        \/\/ Starlux 配色\\n        const colors \x3d \x7b\\n        earthGold: \x27#9B8A5E\x27,\\n        earthGoldLight: \x27rgba(155, 138, 94, 0.6)\x27,\\n        highlight: \x27#FFB554\x27,\\n        obsidian: \x27#45464D\x27\\n        \x7d;\\n\\n        \/\/ 銷毀舊實例\\n        if (distributionChartInstance) \x7b\\n        distributionChartInstance.destroy();\\n        \x7d\\n\\n        \/\/ 標記學生所在區間\\n        const backgroundColors \x3d distData.labels.map((label, idx) \x3d\x3e \x7b\\n        return idx \x3d\x3d\x3d distData.myRangeIndex\\n        ? colors.highlight\\n        : colors.earthGoldLight;\\n        \x7d);\\n\\n        distributionChartInstance \x3d new Chart(distCtx, \x7b\\n        type: \x27bar\x27,\\n        data: \x7b\\n        labels: distData.labels,\\n        datasets: \x5b\x7b\\n        label: \x27人數\x27,\\n        data: distData.data,\\n        backgroundColor: backgroundColors,\\n        borderColor: colors.earthGold,\\n        borderWidth: 1,\\n        borderRadius: 6\\n        \x7d\x5d\\n        \x7d,\\n        options: \x7b\\n        responsive: true,\\n        maintainAspectRatio: false,\\n        plugins: \x7b\\n        legend: \x7b display: false \x7d,\\n        title: \x7b\\n        display: true,\\n        text: \x27全班成績分佈\x27,\\n        font: \x7b size: 14, weight: \x27600\x27 \x7d,\\n        color: \x27#45464D\x27,\\n        padding: \x7b bottom: 16 \x7d\\n        \x7d,\\n        tooltip: \x7b\\n        callbacks: \x7b\\n        afterLabel: function (context) \x7b\\n        if (context.dataIndex \x3d\x3d\x3d distData.myRangeIndex) \x7b\\n        return \x27⬅️ 你的成績區間\x27;\\n        \x7d\\n        return \x27\x27;\\n        \x7d\\n        \x7d\\n        \x7d\\n        \x7d,\\n        scales: \x7b\\n        y: \x7b\\n        beginAtZero: true,\\n        title: \x7b\\n        display: true,\\n        text: \x27人數\x27,\\n        color: \x27#45464D\x27,\\n        font: \x7b weight: \x27500\x27 \x7d\\n        \x7d,\\n        ticks: \x7b\\n        stepSize: 1,\\n        color: colors.obsidian\\n        \x7d,\\n        grid: \x7b color: \x27rgba(0,0,0,0.05)\x27 \x7d\\n        \x7d,\\n        x: \x7b\\n        title: \x7b\\n        display: true,\\n        text: \x27分數區間\x27,\\n        color: \x27#45464D\x27,\\n        font: \x7b weight: \x27500\x27 \x7d\\n        \x7d,\\n        ticks: \x7b color: colors.obsidian \x7d,\\n        grid: \x7b display: false \x7d\\n        \x7d\\n        \x7d\\n        \x7d\\n        \x7d);\\n        \x7d\\n\\n        \/\/ 🆕 渲染趨勢圖 (分離出來以保持程式碼整潔)\\n        function renderTrendChart(trendData) \x7b\\n        if (!trendData || trendData.labels.length \x3d\x3d\x3d 0) return;\\n\\n        const trendCtx \x3d document.getElementById(\x27trendChart\x27).getContext(\x272d\x27);\\n        const colors \x3d \x7b\\n        earthGold: \x27#9B8A5E\x27,\\n        earthGoldLight: \x27rgba(155, 138, 94, 0.6)\x27,\\n        roseGold: \x27#B4745A\x27,\\n        roseGoldLight: \x27rgba(180, 116, 90, 0.6)\x27,\\n        obsidian: \x27#45464D\x27\\n        \x7d;\\n\\n        \/\/ 銷毀舊實例\\n        if (trendChartInstance) \x7b\\n        trendChartInstance.destroy();\\n        \x7d\\n\\n        trendChartInstance \x3d new Chart(trendCtx, \x7b\\n        type: \x27line\x27,\\n        data: \x7b\\n        labels: trendData.labels,\\n        datasets: \x5b\\n        \x7b\\n        label: \x27我的成績\x27,\\n        data: trendData.myScores,\\n        borderColor: colors.earthGold,\\n        backgroundColor: colors.earthGoldLight,\\n        borderWidth: 3,\\n        pointRadius: 6,\\n        pointBackgroundColor: colors.earthGold,\\n        pointBorderColor: \x27#fff\x27,\\n        pointBorderWidth: 2,\\n        tension: 0.3,\\n        fill: false\\n        \x7d,\\n        \x7b\\n        label: \x27班級平均\x27,\\n        data: trendData.classAvg,\\n        borderColor: colors.roseGoldLight,\\n        backgroundColor: \x27transparent\x27,\\n        borderWidth: 2,\\n        borderDash: \x5b5, 5\x5d,\\n        pointRadius: 4,\\n        pointBackgroundColor: colors.roseGold,\\n        tension: 0.3,\\n        fill: false\\n        \x7d\\n        \x5d\\n        \x7d,\\n        options: \x7b\\n        responsive: true,\\n        maintainAspectRatio: false,\\n        plugins: \x7b\\n        legend: \x7b\\n        display: true,\\n        position: \x27bottom\x27,\\n        labels: \x7b\\n        color: colors.obsidian,\\n        usePointStyle: true,\\n        padding: 12\\n        \x7d\\n        \x7d\\n        \x7d,\\n        scales: \x7b\\n        y: \x7b\\n        min: 0,\\n        max: 100,\\n        title: \x7b\\n        display: true,\\n        text: \x27分數\x27,\\n        color: \x27#45464D\x27,\\n        font: \x7b weight: \x27500\x27 \x7d\\n        \x7d,\\n        ticks: \x7b\\n        stepSize: 20,\\n        color: colors.obsidian\\n        \x7d,\\n        grid: \x7b color: \x27rgba(0,0,0,0.05)\x27 \x7d\\n        \x7d,\\n        x: \x7b\\n        title: \x7b\\n        display: true,\\n        text: \x27考試\x27,\\n        color: \x27#45464D\x27,\\n        font: \x7b weight: \x27500\x27 \x7d\\n        \x7d,\\n        ticks: \x7b color: colors.obsidian \x7d,\\n        grid: \x7b display: false \x7d\\n        \x7d\\n        \x7d\\n        \x7d\\n        \x7d);\\n        \x7d    \x3c\\\/script\x3e\\n\x3c\\\/body\x3e\\n\\n\x3c\\\/html\x3e\x22,\x22ncc\x22:\x22\x7b\\\x22awhs\\\x22:true\x7d\x22\x7d", "", undefined, true , false  , "false", "https:\/\/n-ctjo7euskiecn6tjbz7ca6ojquu6ceg2kshzgji-0lu-script.googleusercontent.com", "https:\/\/drive.google.com\/abuse?id\x3dAKkXjox50Ia6Z9thK8BpGLmTf1klMrGRdeThnZT87NRaF8L-_oGfhgkPUcdLbSDELKKCqieOdeSOC5OgvfwY8-csG4k5RtkgS4A0rJr4%3A0\x26docurl\x3dhttps%3A%2F%2Fscript.google.com%2Fmacros%2Fs%2FAKfycbwtmiwyFUYcw2_sXZHcjKF8c8AgVHVhb8EnEyN2VyrybyW5PLYMPo577tOSvv8-kPS7NQ%2Fexec");}
