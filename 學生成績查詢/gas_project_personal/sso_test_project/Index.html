<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #2c3e50; }
        .loading {
            font-size: 16px;
            color: #666;
            margin: 20px 0;
        }
        .result-box {
            display: none;
            background: #eef2f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
        }
        .result-item {
            margin: 10px 0;
            font-size: 14px;
        }
        .label {
            font-weight: bold;
            color: #555;
            display: inline-block;
            width: 80px;
        }
        .success-text { color: #27ae60; font-weight: bold; }
        .error-text { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>SSO 身分驗證測試</h2>
        
        <div id="loader" class="loading">
            正在透過 Google 驗證您的身分...
        </div>
        
        <div id="resultBox" class="result-box">
            <div id="statusMsg" style="text-align:center; margin-bottom: 15px;"></div>
            
            <div id="dataSection" style="display:none;">
                <div class="result-item"><span class="label">完整信箱：</span> <span id="valEmail"></span></div>
                <div class="result-item"><span class="label">帳號部分：</span> <span id="valAccount"></span></div>
                <div class="result-item"><span class="label">網域部分：</span> <span id="valDomain"></span></div>
            </div>
        </div>
    </div>

    <script>
        // 頁面載入後自動呼叫後端驗證身分
        window.onload = function() {
            google.script.run
                .withSuccessHandler(function(res) {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('resultBox').style.display = 'block';
                    
                    if(res.success) {
                        document.getElementById('statusMsg').innerHTML = '<span class="success-text">✅ 驗證成功！這是系統讀取到的身分：</span>';
                        document.getElementById('dataSection').style.display = 'block';
                        document.getElementById('valEmail').innerText = res.email;
                        document.getElementById('valAccount').innerText = res.account;
                        document.getElementById('valDomain').innerText = res.domain;
                    } else {
                        document.getElementById('statusMsg').innerHTML = '<span class="error-text">❌ 驗證失敗：' + res.message + '</span>';
                    }
                })
                .withFailureHandler(function(err) {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('resultBox').style.display = 'block';
                    document.getElementById('statusMsg').innerHTML = '<span class="error-text">⚠️ 系統錯誤：請確認是否已授權腳本執行。</span>';
                })
                .getUserIdentity();
        };
    </script>
</body>
</html>
